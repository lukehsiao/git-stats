name: Binaries

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach binaries to (e.g. v0.1.21)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (e.g. v0.1.21)"
        required: true
        type: string

permissions: {}

# A called workflow sees the caller's name in "github.workflow". A group
# built from it would equal the group of release.yml and deadlock, so the
# group uses a fixed prefix. A newer run waits instead of cancelling an
# upload that is in progress.
concurrency:
  group: binaries-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # A build takes about 3 minutes. The limit leaves room for a slow
    # cross or Windows build.
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use-cross: false
            ext: tar.gz
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            use-cross: true
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use-cross: true
            ext: tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            use-cross: true
            ext: tar.gz
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-latest
            use-cross: true
            ext: tar.gz
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            use-cross: true
            ext: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            use-cross: false
            ext: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            use-cross: false
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            use-cross: false
            ext: zip
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            use-cross: false
            ext: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.use-cross }}" == "true" ]]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Create archive (tar.gz)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          mkdir stage
          cp target/${{ matrix.target }}/release/git-stats LICENSE.md README.md stage/
          tar czf git-stats-${{ matrix.target }}.tar.gz \
            -C stage git-stats LICENSE.md README.md

      - name: Create archive (zip, Windows)
        if: matrix.ext == 'zip' && runner.os == 'Windows'
        shell: bash
        run: |
          mkdir stage
          cp target/${{ matrix.target }}/release/git-stats.exe LICENSE.md README.md stage/
          cd stage
          7z a ../git-stats-${{ matrix.target }}.zip git-stats.exe LICENSE.md README.md

      - name: Generate checksums
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            shasum -a 256 git-stats-${{ matrix.target }}.${{ matrix.ext }} > git-stats-${{ matrix.target }}.${{ matrix.ext }}.sha256
          else
            sha256sum git-stats-${{ matrix.target }}.${{ matrix.ext }} > git-stats-${{ matrix.target }}.${{ matrix.ext }}.sha256
          fi

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            git-stats-${{ matrix.target }}.${{ matrix.ext }} \
            git-stats-${{ matrix.target }}.${{ matrix.ext }}.sha256 \
            --clobber
