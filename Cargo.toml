[package]
name = "git-stats"
version = "0.2.6"
edition = "2024"
authors = ["Luke Hsiao <luke@hsiao.dev>"]
description = "A tool for getting aggregated commit stats"
repository = "https://github.com/lukehsiao/git-stats"
homepage = "https://github.com/lukehsiao/git-stats"
license = "BlueOak-1.0.0"
keywords = ["git", "stats"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["wrap_help", "derive"] }
gix = { version = "0.86.0", default-features = false, features = [
    "revision",
    "blob-diff",
    "mailmap",
    "parallel",
    "max-performance-safe",
    "sha1",
] }
rayon = "1.12.0"
regex = "1.13.1"
tabled = { version = "0.21.0", features = ["ansi"] }
thiserror = "2.0.18"
yansi = { version = "1.0.1", features = ["detect-tty", "detect-env"] }

[dev-dependencies]
hegeltest = "0.28.0"
tempfile = "3.27.0"
yansi = "1.0.1"
